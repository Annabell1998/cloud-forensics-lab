input {
  file {
    path => "/logs/activity.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => plain {
      charset => "UTF-8"
    }
  }
}

filter {
  grok {
    match => {
      "message" => [
        "%{TIMESTAMP_ISO8601:event_time}\s*-\s*%{DATA:event_action}\s*-\s*%{GREEDYDATA:kv_data}"
      ]
    }
  }

  date {
    match => [ "event_time", "ISO8601" ]
    target => "@timestamp"
  }

  kv {
    source => "kv_data"
    field_split => " "
    value_split => "="
    trim_key => " "
    trim_value => "\""
  }

  mutate {
    uppercase => [ "event_action" ]
    add_field => {
      "lab_name" => "cloud_forensics_lab"
      "environment" => "docker_cloud_lab"
    }
  }

  if [ip] {
    mutate {
      rename => { "ip" => "source_ip" }
    }
  }

  if [user] {
    mutate {
      rename => { "user" => "username" }
    }
  }

  if [file] {
    mutate {
      rename => { "file" => "evidence_file" }
    }
  }

  if [event_action] == "DELETE" {
    mutate {
      add_tag => [ "malicious", "delete_event" ]
      add_field => {
        "threat_type" => "file_deletion"
        "severity" => "high"
      }
    }
  }

  if [event_action] == "MASS_DOWNLOAD" {
    mutate {
      add_tag => [ "anomaly", "mass_download" ]
      add_field => {
        "threat_type" => "massive_download"
        "severity" => "medium"
      }
    }
  }

  if [event_action] == "FAILED_LOGIN" {
    mutate {
      add_tag => [ "malicious", "failed_login" ]
      add_field => {
        "threat_type" => "unauthorized_access_attempt"
        "severity" => "medium"
      }
    }
  }

  if [event_action] == "CLEAR_LOGS" {
    mutate {
      add_tag => [ "malicious", "log_cleaning" ]
      add_field => {
        "threat_type" => "log_tampering"
        "severity" => "critical"
      }
    }
  }

  if [username] == "user_unknown" {
    mutate {
      add_tag => [ "suspicious_user" ]
    }
  }

  if "_grokparsefailure" in [tags] {
    mutate {
      add_tag => [ "unparsed_log" ]
    }
  }
}

output {
  stdout {
    codec => rubydebug
  }

  elasticsearch {
    hosts => [ "http://elasticsearch:9200" ]
    index => "cloud-forensics-%{+YYYY.MM.dd}"
  }
}
